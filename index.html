<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libra ML Interactive Demo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1><i class="fas fa-brain"></i> Libra ML Interactive Demo</h1>
            <p>Experience machine learning in one line of code</p>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <section class="demo-section">
                <div class="controls">
                    <h2>Choose an Example</h2>
                    <div class="example-buttons">
                        <button class="example-btn active" data-example="regression">
                            <i class="fas fa-chart-line"></i> Regression
                        </button>
                        <button class="example-btn" data-example="classification">
                            <i class="fas fa-tags"></i> Classification
                        </button>
                        <button class="example-btn" data-example="neural-network">
                            <i class="fas fa-network-wired"></i> Neural Network
                        </button>
                        <button class="example-btn" data-example="preprocessing">
                            <i class="fas fa-filter"></i> Data Preprocessing
                        </button>
                    </div>
                </div>

                <div class="demo-grid">
                    <div class="code-section">
                        <div class="section-header">
                            <h3><i class="fas fa-code"></i> Code Editor</h3>
                            <div class="code-actions">
                                <button class="action-btn" id="copy-code" title="Copy Code">
                                    <i class="fas fa-copy"></i>
                                </button>
                                <button class="action-btn" id="run-code" title="Run Code">
                                    <i class="fas fa-play"></i> Run
                                </button>
                            </div>
                        </div>
                        <div class="code-editor">
                            <pre><code class="language-python" id="code-content"># Loading example...</code></pre>
                        </div>
                    </div>

                    <div class="output-section">
                        <div class="section-header">
                            <h3><i class="fas fa-terminal"></i> Output</h3>
                            <button class="action-btn" id="clear-output" title="Clear Output">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                        <div class="output-display" id="output-display">
                            <div class="output-placeholder">
                                <i class="fas fa-play-circle"></i>
                                <p>Click "Run" to see the output</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="info-section">
                    <h3><i class="fas fa-info-circle"></i> About This Example</h3>
                    <div class="example-description" id="example-description">
                        Select an example above to see how Libra makes machine learning incredibly simple with one-liner commands.
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
